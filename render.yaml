services:
  # Backend Web Service
  - type: web
    name: 1fi-product-emi-api
    env: node
    plan: free
    buildCommand: npm install --prefix server && npm run build --prefix server && npm run prisma:generate --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://1fi-product-emi.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: 1fi-product-emi-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: 1fi-product-emi-client
    env: static
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://1fi-product-emi-api.onrender.com/api

databases:
  - name: 1fi-product-emi-db
    plan: free
    databaseName: product_emi_db
    user: postgres
